  <title>AXIS — لا يوجد اتصال</title>
  <style>

<body><main><div class="mark"><span>AXIS</span></div><strong>AXIS</strong><h1>أنت غير متصل بالإنترنت</h1><p>يلزم الاتصال بالإنترنت لتحميل المنشورات والبيانات الخاصة. أعد الاتصال ثم افتح الصفحة مرة أخرى.</p><a href="/">إعادة المحاولة</a></main></body>
