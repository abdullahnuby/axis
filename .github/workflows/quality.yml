name: AXIS typecheck and build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/professional-language-switcher

permissions:
  contents: read

concurrency:
  group: axis-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Localization checks
        run: npm run test:i18n

      - name: Production build
        run: npm run build
