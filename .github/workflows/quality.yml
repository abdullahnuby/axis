name: AXIS quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: axis-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Smoke tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static regression suite
        run: npm test
      - name: Type-check the application
        run: npm run typecheck
